# =============================================================================
# Figma MCP Server - Docker Compose
# =============================================================================

version: '3.8'

services:
  figma-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: figma-mcp:latest
    container_name: figma-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Figma API (REQUIRED)
      - FIGMA_ACCESS_TOKEN=${FIGMA_ACCESS_TOKEN}
      
      # Server configuration
      - PORT=3000
      - HOST=0.0.0.0
      - MCP_PATH=/mcp
      
      # Logging
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-info}
      - FIGMA_LOG_LEVEL=${FIGMA_LOG_LEVEL:-info}
      - NODE_ENV=production
      
      # Authentication (optional - enable for production)
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_ALLOWED_IPS=${MCP_ALLOWED_IPS}
      
      # Rate limiting (optional - override defaults)
      - MCP_RATE_LIMIT_RPS=${MCP_RATE_LIMIT_RPS:-10}
      - MCP_RATE_LIMIT_BURST=${MCP_RATE_LIMIT_BURST:-10}
      
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
      
    # Resource limits (adjust based on usage)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Logging driver
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: figma-mcp-network